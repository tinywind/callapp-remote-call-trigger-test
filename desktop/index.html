<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Remote Call Trigger</title>
  </head>
  <body>
    <main class="app-shell">
      <section class="panel" aria-labelledby="app-title">
        <div class="heading">
          <h1 id="app-title">Remote Call Trigger</h1>
          <p>Send a local-network call request to the Android receiver.</p>
        </div>

        <form id="call-form" class="call-form">
          <label>
            Phone IP
            <input
              id="phone-ip"
              name="phoneIp"
              inputmode="decimal"
              autocomplete="off"
              placeholder="192.168.0.25"
              required
            />
          </label>

          <label>
            Port
            <input
              id="phone-port"
              name="phonePort"
              inputmode="numeric"
              autocomplete="off"
              value="8088"
              required
            />
          </label>

          <label>
            Token
            <input
              id="call-token"
              name="callToken"
              autocomplete="off"
              value="dev-token"
              required
            />
          </label>

          <label>
            Number
            <input
              id="phone-number"
              name="phoneNumber"
              inputmode="tel"
              autocomplete="off"
              placeholder="+821012345678"
              required
            />
          </label>

          <label>
            SMS Message
            <textarea
              id="sms-message"
              name="smsMessage"
              rows="4"
              autocomplete="off"
              placeholder="Text message to send"
            ></textarea>
          </label>

          <button id="demo-button" class="demo-button" type="button">
            Demo: Call, Hang Up After 3s
          </button>

          <div class="button-row" aria-label="Manual controls">
            <button id="call-button" type="submit">Trigger Call</button>
            <button id="hangup-button" type="button">Hang Up</button>
          </div>

          <div class="button-row" aria-label="SMS controls">
            <button id="sms-button" class="sms-button" type="button">Send SMS</button>
            <button id="sms-backup-button" class="backup-button" type="button">Backup SMS</button>
          </div>
        </form>

        <output id="status" class="status" role="status">Idle</output>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
