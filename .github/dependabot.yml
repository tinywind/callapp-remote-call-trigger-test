version: 2
updates:
- package-ecosystem: cargo
  directory: /desktop/src-tauri
  schedule:
    interval: weekly
    day: monday
    time: "03:00"
    timezone: Asia/Phnom_Penh
  open-pull-requests-limit: 5
  commit-message:
    prefix: chore
    include: scope
  groups:
    minor-and-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
- package-ecosystem: gradle
  directory: /android
  schedule:
    interval: weekly
    day: monday
    time: "03:00"
    timezone: Asia/Phnom_Penh
  open-pull-requests-limit: 5
  commit-message:
    prefix: chore
    include: scope
  groups:
    minor-and-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
- package-ecosystem: npm
  directory: /desktop
  schedule:
    interval: weekly
    day: monday
    time: "03:00"
    timezone: Asia/Phnom_Penh
  open-pull-requests-limit: 5
  commit-message:
    prefix: chore
    include: scope
  groups:
    minor-and-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
